<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
  :root{--gold:#E2A84B;--gold-light:#F7D48A;--gold-pale:#FFF3D1;--crimson:#D11A35;
    --metal:linear-gradient(120deg,#8E5A1A 0%,#C98B30 16%,#F7D48A 32%,#FFF3D1 42%,#E2A84B 55%,#B9772A 72%,#F2C76E 88%,#8E5A1A 100%);
    --btn:linear-gradient(120deg,#B9772A 0%,#E2A84B 28%,#F7D48A 50%,#E2A84B 72%,#B9772A 100%)}
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#070b14}
  .ad{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'Montserrat',sans-serif;
    background:url('v1-cover.jpg') center 40px/1080px auto no-repeat, linear-gradient(180deg,#070b14,#13213a 60px)}
  .shade-top{position:absolute;inset:0 0 auto 0;height:380px;background:linear-gradient(180deg,rgba(5,8,16,.95) 0%,rgba(5,8,16,.7) 55%,transparent)}
  .shade-bot{position:absolute;inset:auto 0 0 0;height:210px;background:linear-gradient(0deg,rgba(9,5,3,.97) 0%,rgba(9,5,3,.8) 45%,transparent)}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .glow{position:absolute;left:300px;top:860px;width:560px;height:420px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(247,212,138,.55),rgba(226,168,75,.2) 45%,transparent 70%);mix-blend-mode:screen}
  .spark{position:absolute;border-radius:50%;background:#FFE7B0;box-shadow:0 0 10px 3px rgba(247,212,138,.85);mix-blend-mode:screen}
  .frame{position:absolute;inset:18px;border-radius:8px;border:2px solid transparent;
    background:linear-gradient(#000,#000) padding-box,var(--metal) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;opacity:.95}
  .corner{position:absolute;color:var(--gold-light);font-size:22px;text-shadow:0 0 10px rgba(247,212,138,.9)}
  .eyebrow{position:absolute;top:40px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;
    color:var(--crimson);font-weight:800;font-size:17px;letter-spacing:5px}
  .eyebrow::before,.eyebrow::after{content:'';width:70px;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold))}
  .eyebrow::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .the{position:absolute;top:70px;left:0;right:0;text-align:center;font-family:'Playfair';font-weight:800;font-size:24px;letter-spacing:14px;color:var(--gold-light);text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .title{position:absolute;top:92px;left:0;right:0;text-align:center;font-family:'Playfair';font-weight:900;font-size:104px;line-height:1;letter-spacing:1px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.75))}
  .title .sex{background:linear-gradient(120deg,#7a0c1d 0%,#D11A35 35%,#ff6b80 50%,#D11A35 65%,#7a0c1d 100%);-webkit-background-clip:text;color:transparent}
  .title .bible{background:var(--metal);-webkit-background-clip:text;color:transparent}
  .hook{position:absolute;top:204px;left:0;right:0;text-align:center;font-family:'Playfair';font-style:italic;font-weight:700;font-size:34px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.9)}
  .sub{position:absolute;top:248px;left:0;right:0;text-align:center;font-family:'Montserrat';font-weight:700;font-size:17px;letter-spacing:5px;color:var(--gold-light);text-shadow:0 2px 12px rgba(0,0,0,.9)}
  .seal{position:absolute;left:868px;top:1000px;width:168px;height:168px;border-radius:50%;background:var(--btn);color:#1a0d04;
    display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(10deg);
    box-shadow:0 0 0 5px rgba(9,5,3,.85),0 0 0 7px rgba(247,212,138,.7),0 14px 40px rgba(0,0,0,.6),0 0 50px rgba(226,168,75,.5)}
  .seal b{font-family:'Playfair';font-weight:900;font-size:50px;line-height:1}
  .seal span{font-weight:800;font-size:15px;letter-spacing:2px;margin-top:4px}
  .seal i{font-style:normal;font-weight:800;font-size:12px;letter-spacing:1.5px;background:var(--crimson);color:#fff;padding:3px 9px;border-radius:99px;margin-top:6px}
  .tag{position:absolute;left:310px;top:922px;padding:7px 16px;border:1.5px solid rgba(247,212,138,.8);border-radius:99px;background:rgba(9,5,3,.72);
    color:var(--gold-pale);font-weight:700;font-size:15px;letter-spacing:2px;backdrop-filter:blur(3px);transform:rotate(-8deg)}
  .bar{position:absolute;left:44px;right:44px;bottom:58px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .price{display:flex;align-items:baseline;gap:14px}
  .price s{font-size:30px;color:#cbbfae;font-weight:700;text-decoration-color:var(--crimson);text-decoration-thickness:3px}
  .price b{font-family:'Playfair';font-weight:900;font-size:84px;line-height:.9;background:var(--metal);-webkit-background-clip:text;color:transparent}
  .cta{display:flex;align-items:center;gap:14px;padding:24px 40px;border-radius:999px;background:var(--btn);color:#1a0d04;font-weight:800;font-size:25px;letter-spacing:2.5px;white-space:nowrap;
    box-shadow:0 0 0 4px rgba(247,212,138,.18),0 12px 44px rgba(226,168,75,.55),inset 0 1px 0 rgba(255,243,209,.8)}
  .trust{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:#cbbfae;font-weight:600;font-size:15px;letter-spacing:1.5px}
  .trust span{color:var(--gold);margin:0 10px}
</style></head><body><div class="ad">
  <div class="shade-top"></div><div class="vignette"></div><div class="glow"></div><div class="shade-bot"></div>
  <div class="frame"></div>
  <div class="corner" style="left:30px;top:24px">✦</div><div class="corner" style="right:30px;top:24px">✦</div>
  <div class="corner" style="left:30px;bottom:22px">✦</div><div class="corner" style="right:30px;bottom:22px">✦</div>
  <div class="eyebrow">FOR MEN · FOR WOMEN · FOR COUPLES</div>
  <div class="the">THE</div>
  <div class="title"><span class="sex">SEX</span> <span class="bible">BIBLE</span></div>
  <div class="hook">Same bed. Same routine. Same silence.</div>
  <div class="sub">THERE'S A WAY BACK</div>
  <div class="tag">258 PAGES + 365 POSITIONS</div>
  <div class="seal"><b>-68%</b><span>TODAY</span><i>48H ONLY</i></div>
  <div id="sparks"></div>
  <div class="bar"><div class="price"><s>$25</s><b>$8</b></div><div class="cta">GET IT NOW <span>→</span></div></div>
  <div class="trust">100% PRIVATE<span>✦</span>INSTANT DOWNLOAD<span>✦</span>READ IT TONIGHT</div>
</div>
<script>
  let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const box = document.getElementById('sparks');
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('div'); s.className = 'spark';
    const a = r() * Math.PI * 2, d = 160 + r() * 200;
    const x = 560 + Math.cos(a) * d * 1.3, y = 1080 + Math.sin(a) * d * .55;
    const z = 2 + r() * 4; s.style.cssText = `left:${x}px;top:${y}px;width:${z}px;height:${z}px;opacity:${.4 + r() * .6}`;
    if (y < 1225 && y > 860) box.appendChild(s);
  }
</script></body></html>
