<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
  .ad{position:relative;width:1080px;height:1350px;background:url('v1-cover.jpg') center/cover no-repeat;font-family:'Montserrat',sans-serif}
  .top{position:absolute;left:0;right:0;top:0;height:330px;background:linear-gradient(180deg,rgba(4,8,18,.82),rgba(4,8,18,.45) 60%,transparent)}
  .headline{position:absolute;left:60px;right:60px;top:52px;text-align:center;font-family:'Playfair';font-weight:800;font-size:60px;line-height:1.12;color:#fff;letter-spacing:.3px;text-shadow:0 3px 18px rgba(0,0,0,.6)}
  .headline span{display:block}
  .headline .last{background:linear-gradient(120deg,#C98B30,#F7D48A 40%,#FFF3D1 50%,#E2A84B 65%,#B9772A);-webkit-background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))}
  .bottom{position:absolute;left:0;right:0;bottom:0;height:240px;background:linear-gradient(0deg,rgba(8,5,3,.92),rgba(8,5,3,.55) 60%,transparent)}
  .sub{position:absolute;left:0;right:0;bottom:112px;text-align:center;font-family:'Playfair';font-style:italic;font-weight:700;font-size:40px;color:#F7D48A;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .cta{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:20px 44px;border-radius:999px;background:linear-gradient(120deg,#B9772A,#E2A84B 28%,#F7D48A 50%,#E2A84B 72%,#B9772A);color:#1a0d04;font-weight:800;font-size:26px;letter-spacing:2.5px;white-space:nowrap;box-shadow:0 10px 40px rgba(226,168,75,.45),inset 0 1px 0 rgba(255,243,209,.7)}
</style></head><body><div class="ad">
  <div class="top"></div><div class="bottom"></div>
  <div class="headline"><span>Same bed. Same routine.</span><span class="last">Same silence.</span></div>
  <div class="sub">There's a way back.</div>
  <div class="cta">GET IT NOW — $8 <span>→</span></div>
</div></body></html>
